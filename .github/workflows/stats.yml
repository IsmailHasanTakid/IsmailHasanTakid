name: Update README stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: IsmailHasanTakid
        run: |
          python3 - <<'EOF'
          import os, json, re, urllib.request
          from collections import Counter

          u = os.environ["USER_NAME"]
          tok = os.environ["GH_TOKEN"]

          def get(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {tok}",
                  "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(req))

          user = get(f"https://api.github.com/users/{u}")
          repos = get(f"https://api.github.com/users/{u}/repos?per_page=100&type=owner")
          own = [r for r in repos if not r["fork"]]
          stars = sum(r["stargazers_count"] for r in own)
          langs = Counter(r["language"] for r in own if r["language"]).most_common(5)

          block = (
              "| 📦 Repositories | ⭐ Stars | 👥 Followers |\n"
              "|:---:|:---:|:---:|\n"
              f"| {len(own)} | {stars} | {user['followers']} |\n\n"
              "**Top Languages:** " + " · ".join(f"{l} ({c})" for l, c in langs)
          )

          s = open("README.md", encoding="utf-8").read()
          s = re.sub(r"(<!--STATS_START-->).*?(<!--STATS_END-->)",
                     lambda m: m.group(1) + "\n" + block + "\n" + m.group(2),
                     s, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(s)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add README.md && git commit -m "chore: update stats" && git push)